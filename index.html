<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ae1026"><title>e-Tiquet-TAC · INS Mollet</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202027;background:#f5f6f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:#ab0e26}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e79aa6;outline-offset:2px}.shell{display:flex;min-height:100vh}.side{width:240px;flex:none;background:#17181d;color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:5px 10px;font-size:19px;font-weight:800}.mark{background:#b30d2b;border-radius:12px;padding:11px;color:white}.side nav{display:grid;gap:5px}.side nav button{display:flex;gap:12px;text-align:left;align-items:center;width:100%;padding:12px;border-radius:10px;background:transparent;color:#d9dce2}.side nav button.active,.side nav button:hover{background:#34353e;color:#fff}.sidefooter{margin-top:auto;font-size:11px;color:#afb1b9;padding:10px}.main{min-width:0;flex:1}.top{background:#fff;border-bottom:1px solid #e5e6ec;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10}.top h1{font-size:19px;margin:0}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.content{max-width:1550px;margin:auto;padding:28px}.btn{border-radius:9px;padding:10px 14px;font-weight:650;background:#fff;border:1px solid #dcdde4;color:#333}.btn:hover{background:#f3f3f5}.btn.primary{background:#ae1026;color:#fff;border-color:#ae1026}.btn.primary:hover{background:#8d1021}.btn.danger{color:#a20e23}.btn.small{padding:6px 9px;font-size:12px}.muted{color:#747782}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e6e6eb;border-radius:14px;padding:18px;box-shadow:0 2px 7px #1a1a1a06}.metric b{font-size:29px;display:block;margin:4px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.sectionhead h2{margin:0;font-size:17px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;text-align:left}.table th{color:#7d808a;font-size:12px;font-weight:650;background:#fafafb}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eeeef2;white-space:nowrap}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#fff7f8}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#f0f1f5;color:#50525a;font-weight:650;font-size:11px}.pill[data-state="En curs"]{background:#e8f1ff;color:#1556ad}.pill[data-state="Bloquejat"],.pill[data-state="Crítica"]{background:#ffe6e8;color:#a00019}.pill[data-state="Pendent d'informació"],.pill[data-state="Pendent de tercers"]{background:#fff1d8;color:#8d5d06}.pill[data-state="Resolt"],.pill[data-state="Tancat"]{background:#e3f6e7;color:#147238}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:650;color:#60636e}input,select,textarea{border:1px solid #dcdde4;border-radius:9px;padding:10px;background:white;color:#202027;width:100%}textarea{resize:vertical;min-height:86px}.toolbar input{max-width:420px}.toolbar select{max-width:205px}.columns{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span2{grid-column:span 2}.detailhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.detailhead h2{font-size:24px;margin:8px 0}.history{display:grid;gap:10px}.event{border-left:3px solid #b71a32;padding:6px 12px;background:#fafafb;border-radius:0 8px 8px 0}.event small{color:#777}.quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.quick{padding:19px;border-radius:14px;border:1px solid #e4e4e8;background:white;min-height:140px;display:flex;flex-direction:column;gap:10px;justify-content:space-between;overflow-wrap:anywhere}.quick.wide{grid-column:span 2}.quick .icon{font-size:25px;color:#b10b2a}.quick a{text-decoration:none;font-weight:800;color:#24242a}.quick a:hover{text-decoration:underline}.quick small{color:#737784}.progress{height:7px;background:#eeeeef;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#b10e29}.task{display:flex;gap:8px;align-items:center;margin:9px 0}.task input{width:auto}.modalback{position:fixed;inset:0;background:#12121899;z-index:40;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:white;border-radius:16px;padding:23px;max-width:850px;width:100%;max-height:94vh;overflow:auto}.modal h2{margin:0 0 18px}.modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.empty{padding:36px;text-align:center;color:#777}.banner{padding:12px 16px;background:#fff5e6;border:1px solid #eed4a6;border-radius:11px;margin:12px 0}.toast{position:fixed;bottom:22px;right:22px;padding:13px 17px;background:#1b1c22;color:white;border-radius:10px;z-index:90;box-shadow:0 5px 22px #0003}.checkrow{display:flex;align-items:center;gap:8px;margin:8px 0}.checkrow input{width:auto}.devices{display:grid;gap:11px}.device{border:1px solid #e4e4e9;border-radius:12px;padding:12px}.code{font-family:ui-monospace,monospace;font-size:12px;color:#a40c24}.space{height:10px}.top small{font-weight:600}.inlineactions{display:flex;gap:7px;flex-wrap:wrap}.nowrap{white-space:nowrap}.mobilemenu{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.quickgrid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.side{width:100%;padding:8px 12px;gap:3px}.side nav{display:flex;overflow:auto}.side nav button{white-space:nowrap;padding:9px}.sidefooter{display:none}.brand{font-size:15px}.top{position:static;padding:14px}.content{padding:14px}.top-actions{justify-content:flex-end}.formgrid{grid-template-columns:1fr}.span2{grid-column:span 1}.grid{grid-template-columns:repeat(2,1fr)}.quickgrid{grid-template-columns:repeat(2,1fr)}.quick.wide{grid-column:span 2}.modal{max-height:96vh;padding:15px}.top h1{font-size:16px}}
</style></head><body><div id="app"></div><script>
'use strict';
const STATES=['Nou','En curs',"Pendent d'informació",'Pendent de tercers','Bloquejat','Resolt','Tancat','Cancel·lat'],PRIORITIES=['Baixa','Normal','Alta','Crítica'],TYPES=['Incidència','Petició','Manteniment','Tasca','Projecte'],CATEGORIES=['Xarxa','Maquinari','Programari','Comptes','Impressores','Audiovisuals','Altres'],CLOSED=['Resolt','Tancat','Cancel·lat'];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),fmt=s=>s?new Date(s).toLocaleString('ca-ES',{dateStyle:'short',timeStyle:'short'}):'—',date=s=>s?new Date(s).toLocaleDateString('ca-ES'):'—';
const blank=()=>({schemaVersion:1,databaseId:id(),revision:0,updatedAt:now(),tickets:[],shortcuts:[],settings:{author:'Servei TAC',categories:CATEGORIES,states:STATES},nextNumberByYear:{}});
let db=blank(),view='home',selectedId=null,fileHandle=null,fileSignature=null,dirty=false,search='',statusFilter='',notifyTimer,openModal=null;
const memoryDB=()=>new Promise((ok,fail)=>{const req=indexedDB.open('etiquetac-local',1);req.onupgradeneeded=()=>req.result.createObjectStore('kv');req.onsuccess=()=>ok(req.result);req.onerror=()=>fail(req.error)});
async function put(key,value){const store=await memoryDB();return new Promise((ok,fail)=>{const tx=store.transaction('kv','readwrite');tx.objectStore('kv').put(value,key);tx.oncomplete=()=>{store.close();ok()};tx.onerror=()=>fail(tx.error)})}
async function get(key){const store=await memoryDB();return new Promise((ok,fail)=>{const tx=store.transaction('kv');const r=tx.objectStore('kv').get(key);r.onsuccess=()=>{store.close();ok(r.result)};r.onerror=()=>fail(r.error)})}
function valid(d){return d&&d.schemaVersion===1&&typeof d.databaseId==='string'&&Array.isArray(d.tickets)&&Array.isArray(d.shortcuts)&&typeof d.settings==='object'&&d.tickets.every(t=>typeof t.uuid==='string'&&typeof t.title==='string'&&Array.isArray(t.events)&&Array.isArray(t.tasks))}
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3600)}
function changed(){db.revision++;db.updatedAt=now();dirty=true;put('database',db).catch(()=>toast('Error desant la còpia local'));render();clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>{if(fileHandle)saveFile(false).catch(console.error)},1300)}
function log(t,kind,text,internal=false){t.events.push({uuid:id(),at:now(),actor:db.settings.author||'Servei TAC',kind,text,internal})}
function getTicket(){return db.tickets.find(t=>t.uuid===selectedId)}
function button(label,fn,cls=''){return '<button class="btn '+cls+'" data-act="'+fn+'">'+label+'</button>'}
function opts(arr,selected){return arr.map(x=>'<option value="'+esc(x)+'" '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
function badge(st){return '<span class="pill" data-state="'+esc(st)+'">'+esc(st)+'</span>'}
function entry(t){return '<tr data-ticket="'+esc(t.uuid)+'"><td class="code">'+esc(t.code)+'</td><td><b>'+esc(t.title)+'</b><br><small class="muted">'+esc(t.category||'')+'</small></td><td>'+badge(t.status)+'</td><td>'+badge(t.priority)+'</td><td>'+esc(t.requester||'—')+'</td><td>'+fmt(t.updatedAt)+'</td></tr>'}
function shortcutCard(s){const href=/^https?:\/\//i.test(s.url)?s.url:'#';return '<div class="quick '+(s.wide?'wide':'')+'"><div class="icon">↗</div><div><a href="'+esc(href)+'" rel="noopener noreferrer" target="_blank">'+esc(s.name)+'</a><br><small>'+esc(s.description||s.url)+'</small></div><button class="btn small" data-act="editShortcut" data-id="'+esc(s.uuid)+'">Editar</button></div>'}
function render(){const activeTickets=db.tickets.filter(t=>!CLOSED.includes(t.status)),blocked=activeTickets.filter(t=>['Bloquejat','Pendent de tercers',"Pendent d'informació"].includes(t.status));const labels={home:'Panell de control',tickets:'Tiquets',devices:'Dispositius',shortcuts:'Accessos ràpids',history:'Historial',settings:'Configuració',detail:'Fitxa de tiquet'};
$('#app').innerHTML='<div class="shell"><aside class="side"><div class="brand"><span class="mark">TAC</span><span>e-Tiquet-TAC</span></div><nav>'+[['home','⌂','Inici'],['tickets','▤','Tiquets'],['devices','▣','Dispositius'],['shortcuts','↗','Accessos ràpids'],['history','◷','Historial'],['settings','⚙','Configuració']].map(([v,i,l])=>'<button data-view="'+v+'" class="'+(view===v||(view==='detail'&&v==='tickets')?'active':'')+'"><span>'+i+'</span>'+l+'</button>').join('')+'</nav><div class="sidefooter">Institut Mollet del Vallès<br>Les dades no es publiquen a GitHub.</div></aside><main class="main"><header class="top"><h1>'+labels[view]+'</h1><div class="top-actions"><small class="muted" title="El desat a OneDrive depèn del client OneDrive">'+(dirty?'● Canvis al fitxer pendents':fileHandle?'✓ Fitxer local vinculat':'● Desat al navegador')+'</small>'+button('＋ Nou tiquet','newTicket','primary')+'</div></header><div class="content">'+content()+'</div></main></div>';if(openModal)drawModal()}
function content(){if(view==='home')return '<div class="grid">'+[['Oberts',db.tickets.filter(t=>!CLOSED.includes(t.status)).length],['En curs',db.tickets.filter(t=>t.status==='En curs').length],['En espera / bloquejats',db.tickets.filter(t=>['Bloquejat',"Pendent d'informació",'Pendent de tercers'].includes(t.status)).length],['Resolts',db.tickets.filter(t=>CLOSED.includes(t.status)).length]].map(([a,b])=>'<div class="card metric"><span class="muted">'+a+'</span><b>'+b+'</b></div>').join('')+'</div><div class="sectionhead"><h2>Requereixen atenció</h2>'+button('Veure tots','goTickets')+'</div>'+ticketTable([...activeTickets].sort((a,b)=>(b.priority==='Crítica')-(a.priority==='Crítica')||new Date(a.updatedAt)-new Date(b.updatedAt)).slice(0,10))+'<div class="sectionhead"><h2>Accessos preferits</h2>'+button('Configurar','goShortcuts')+'</div><div class="quickgrid">'+(db.shortcuts.filter(s=>s.favorite).map(shortcutCard).join('')||'<div class="card muted">Encara no tens accessos preferits.</div>')+'</div>';
if(view==='tickets'){const list=db.tickets.filter(t=>(!statusFilter||t.status===statusFilter)&&(!search||[t.code,t.title,t.description,t.requester,t.location,t.category,...(t.devices||[]).map(d=>[d.inventory,d.serial,d.model].join(' ')),...t.events.map(e=>e.text)].join(' ').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return '<div class="toolbar"><input id="search" placeholder="Cerca per ID, títol, dispositiu, comentaris..." value="'+esc(search)+'"><select id="filter"><option value="">Tots els estats</option>'+opts(db.settings.states||STATES,statusFilter)+'</select>'+button('Exportar CSV','csv')+'</div>'+ticketTable(list)}
if(view==='detail')return detail();
if(view==='devices'){const ds=db.tickets.flatMap(t=>(t.devices||[]).map(d=>({...d,ticket:t})));return '<div class="sectionhead"><h2>Dispositius vinculats a tiquets</h2></div><div class="card tablewrap"><table class="table"><thead><tr><th>Tipus</th><th>Equip</th><th>Inventari</th><th>Sèrie</th><th>Tiquet</th><th>Retorn</th></tr></thead><tbody>'+ds.map(d=>'<tr data-ticket="'+esc(d.ticket.uuid)+'"><td>'+esc(d.role==='loan'?'Cedit / préstec':'Amb problema')+'</td><td>'+esc(d.type)+' '+esc(d.model)+'</td><td>'+esc(d.inventory)+'</td><td>'+esc(d.serial)+'</td><td>'+esc(d.ticket.code)+'</td><td>'+esc(d.role==='loan'?(d.returnedAt?'Retornat '+date(d.returnedAt):'Pendent'):'—')+'</td></tr>').join('')+'</tbody></table>'+(ds.length?'':'<div class="empty">Els equips apareixeran aquí en associar-los a un tiquet.</div>')+'</div>'}
if(view==='shortcuts')return '<div class="sectionhead"><h2>Les meves eines</h2>'+button('＋ Afegir accés','newShortcut','primary')+'</div><div class="quickgrid">'+db.shortcuts.map(shortcutCard).join('')+'</div>'+(db.shortcuts.length?'':'<div class="card empty">Afegeix les webs que fas servir cada dia.</div>');
if(view==='history'){const ev=db.tickets.flatMap(t=>t.events.map(e=>({...e,ticket:t}))).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,250);return '<div class="card history">'+ev.map(e=>'<div class="event" data-ticket="'+esc(e.ticket.uuid)+'"><small>'+fmt(e.at)+' · '+esc(e.ticket.code)+' · '+esc(e.actor)+' · '+esc(e.kind)+'</small><div>'+esc(e.text)+'</div></div>').join('')+(ev.length?'':'<div class="empty">Encara no hi ha moviments.</div>')+'</div>'}
if(view==='settings')return '<div class="columns"><div class="card"><h2>Preferències</h2><div class="field"><label>Nom que signa les actuacions</label><input id="author" value="'+esc(db.settings.author||'')+'"></div><div class="space"></div>'+button('Desar preferències','saveSettings','primary')+'<hr><h2>Base de dades</h2><p class="muted">Dades actuals: '+db.tickets.length+' tiquets · Revisió '+db.revision+'</p><p class="muted">Un fitxer a la carpeta OneDrive NO assegura que els canvis estiguin sincronitzats al núvol.</p><div class="inlineactions">'+button('Vincular fitxer JSON','linkFile')+button('Desar al fitxer vinculat','forceSave')+button('Descarregar còpia JSON','exportJson')+button('Importar JSON','importJson')+'</div><p class="muted">L'aplicació no fusiona edicions simultànies: si detecta que el fitxer ha canviat, bloqueja la sobreescriptura.</p></div><div class="card"><h2>Informació</h2><p>e-Tiquet-TAC · Institut Mollet del Vallès</p><p class="muted">Fitxer de dades extern: '+(fileHandle?esc(fileHandle.name):'no vinculat')+'</p><p class="muted">Emmagatzematge local: IndexedDB</p><p class="muted">Els documents i les dades no s'envien a cap servidor de l'aplicació.</p></div></div>';
return ''}
function ticketTable(list){return '<div class="card tablewrap"><table class="table"><thead><tr><th>ID</th><th>Tiquet</th><th>Estat</th><th>Prioritat</th><th>Sol·licitant</th><th>Actualitzat</th></tr></thead><tbody>'+list.map(entry).join('')+'</tbody></table>'+(list.length?'':'<div class="empty">No hi ha tiquets per mostrar.</div>')+'</div>'}
function detail(){const t=getTicket();if(!t){view='tickets';return ticketTable(db.tickets)}const done=t.tasks.filter(x=>x.done).length;return '<div class="detailhead"><div><div class="code">'+esc(t.code)+'</div><h2>'+esc(t.title)+'</h2><span class="muted">'+esc(t.type)+' · '+esc(t.category)+' · '+fmt(t.createdAt)+'</span></div><div class="inlineactions">'+button('Copiar ID','copyId')+button('Copiar per correu','copyTicket','primary')+button('Editar','editTicket')+'</div></div><div class="space"></div><div class="columns"><div><div class="card"><div class="formgrid"><div class="field"><label>Estat</label><select id="detailStatus">'+opts(db.settings.states||STATES,t.status)+'</select></div><div class="field"><label>Prioritat</label><select id="detailPriority">'+opts(PRIORITIES,t.priority)+'</select></div></div><h3>Descripció</h3><p style="white-space:pre-wrap">'+esc(t.description||'Sense descripció')+'</p><p class="muted">Sol·licitant: '+esc(t.requester||'—')+' · '+esc(t.email||'—')+'<br>Responsable: '+esc(t.assignee||'—')+' · Ubicació: '+esc(t.location||'—')+'<br>Data límit: '+esc(t.dueDate||'—')+'</p></div><div class="sectionhead"><h2>Subtasques ('+done+'/'+t.tasks.length+')</h2>'+button('＋ Subtasca','addTask')+'</div><div class="card"><div class="progress"><div style="width:'+(t.tasks.length?done/t.tasks.length*100:0)+'%"></div></div>'+t.tasks.map(task=>'<div class="task"><input type="checkbox" data-task="'+esc(task.uuid)+'" '+(task.done?'checked':'')+'><span style="'+(task.done?'text-decoration:line-through;color:#777':'')+';flex:1">'+esc(task.title)+'</span><button class="btn small danger" data-act="removeTask" data-id="'+esc(task.uuid)+'">×</button></div>').join('')+(t.tasks.length?'':'<p class="muted">Sense subtasques.</p>')+'</div><div class="sectionhead"><h2>Registre i comentaris</h2>'+button('＋ Comentari','addComment')+'</div><div class="card history">'+[...t.events].reverse().map(e=>'<div class="event"><small>'+fmt(e.at)+' · '+esc(e.actor)+' · '+esc(e.kind)+(e.internal?' · Intern':'')+'</small><div style="white-space:pre-wrap">'+esc(e.text)+'</div></div>').join('')+'</div></div><div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Dispositius</h2>'+button('＋ Afegir','addDevice')+'</div><div class="devices">'+(t.devices||[]).map(d=>'<div class="device"><b>'+esc(d.role==='loan'?'Equip cedit':'Equip amb problema')+'</b><p>'+esc(d.type)+' · '+esc(d.model)+'</p><small class="muted">Inventari: '+esc(d.inventory||'—')+'<br>Sèrie: '+esc(d.serial||'—')+'</small><p>'+esc(d.notes)+'</p>'+(d.role==='loan'&&!d.returnedAt?'<button class="btn small" data-act="returnDevice" data-id="'+esc(d.uuid)+'">Registrar devolució</button>':'')+' <button class="btn small danger" data-act="removeDevice" data-id="'+esc(d.uuid)+'">Eliminar</button></div>').join('')+(t.devices?.length?'':'<p class="muted">No hi ha dispositius vinculats.</p>')+'</div></div><div class="space"></div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Enllaços</h2>'+button('＋ Enllaç','addLink')+'</div>'+(t.links||[]).map(l=>'<p><a href="'+esc(/^https?:\/\//.test(l.url)?l.url:'#')+'" target="_blank" rel="noopener noreferrer">'+esc(l.title)+'</a> <button class="btn small danger" data-act="removeLink" data-id="'+esc(l.uuid)+'">×</button></p>').join('')+(t.links?.length?'':'<p class="muted">Sense enllaços.</p>')+'</div></div></div>'}
function modal(title,html,saveLabel='Desar',saveAction='submitModal'){openModal={title,html,saveLabel,saveAction};drawModal()}
function drawModal(){document.querySelector('.modalback')?.remove();if(!openModal)return;const el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>'+esc(openModal.title)+'</h2><form id="modalForm">'+openModal.html+'<div class="modalfoot">'+button('Cancel·lar','closeModal')+'<button type="submit" class="btn primary">'+esc(openModal.saveLabel)+'</button></div></form></div>';document.body.append(el);el.addEventListener('click',e=>{if(e.target===el)closeModal()})}
function closeModal(){openModal=null;document.querySelector('.modalback')?.remove()}
const f=(name,label,value='',type='text',extra='')=>'<div class="field"><label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>';
const sel=(name,label,list,value)=>'<div class="field"><label>'+label+'</label><select name="'+name+'">'+opts(list,value)+'</select></div>';
function ticketModal(t){const html='<div class="formgrid">'+f('title','Títol *',t?.title||'','text','required maxlength="200"')+sel('type','Tipus',TYPES,t?.type||TYPES[0])+sel('category','Categoria',db.settings.categories||CATEGORIES,t?.category||'Altres')+sel('priority','Prioritat',PRIORITIES,t?.priority||'Normal')+sel('status','Estat',db.settings.states||STATES,t?.status||'Nou')+f('requester','Sol·licitant',t?.requester)+f('email','Correu electrònic',t?.email,'email')+f('assignee','Responsable',t?.assignee)+f('location','Ubicació',t?.location)+f('dueDate','Data límit',t?.dueDate,'date')+'<div class="field span2"><label>Descripció</label><textarea name="description">'+esc(t?.description||'')+'</textarea></div></div>';modal(t?'Editar tiquet':'Crear tiquet',html)}
function shortcutModal(s){modal(s?'Editar accés ràpid':'Nou accés ràpid','<div class="formgrid">'+f('name','Nom *',s?.name,'text','required')+f('url','URL *',s?.url,'url','required pattern="https?://.*"')+f('description','Descripció',s?.description)+'<div class="field"><label><input type="checkbox" name="favorite" style="width:auto" '+(s?.favorite?'checked':'')+'> Mostrar a inici</label><label><input type="checkbox" name="wide" style="width:auto" '+(s?.wide?'checked':'')+'> Targeta ampla</label></div></div>')}
function eventAction(action,el){const t=getTicket();if(action==='newTicket'){selectedId=null;ticketModal(null)}else if(action==='editTicket')ticketModal(t);else if(action==='closeModal')closeModal();else if(action==='goTickets'){view='tickets';render()}else if(action==='goShortcuts'){view='shortcuts';render()}else if(action==='newShortcut'){selectedId=null;shortcutModal(null)}else if(action==='editShortcut'){selectedId=el.dataset.id;shortcutModal(db.shortcuts.find(s=>s.uuid===selectedId))}else if(action==='saveSettings'){db.settings.author=$('#author').value.trim()||'Servei TAC';changed();toast('Preferències desades')}else if(action==='addTask'){modal('Nova subtasca',f('title','Descripció *','','text','required'))}else if(action==='addComment'){modal('Nou comentari','<div class="field"><label>Comentari</label><textarea name="text" required></textarea></div><label class="checkrow"><input type="checkbox" name="internal"> Comentari intern (no incloure en correus)</label>')}else if(action==='addDevice'){modal('Vincular dispositiu','<div class="formgrid">'+sel('role','Funció',['problem','loan'],'problem')+f('type','Tipus','Portàtil')+f('model','Marca i model')+f('inventory','Codi inventari')+f('serial','Número de sèrie')+f('recipient','Destinatari del préstec')+f('returnDue','Retorn previst','','date')+'<div class="field span2"><label>Observacions</label><textarea name="notes"></textarea></div></div>')}else if(action==='addLink'){modal('Afegir enllaç',f('title','Nom de la referència *','','text','required')+f('url','URL *','','url','required pattern="https?://.*"'))}else if(action==='removeTask'||action==='removeDevice'||action==='removeLink'){if(!confirm('Vols eliminar aquest element?'))return;const prop=action==='removeTask'?'tasks':action==='removeDevice'?'devices':'links';t[prop]=t[prop].filter(x=>x.uuid!==el.dataset.id);log(t,'Eliminació','Element eliminat de '+prop);t.updatedAt=now();changed()}else if(action==='returnDevice'){const d=t.devices.find(x=>x.uuid===el.dataset.id);d.returnedAt=now();log(t,'Préstec','Equip retornat: '+(d.inventory||d.model));t.updatedAt=now();changed()}else if(action==='copyId'){navigator.clipboard.writeText(t.code).then(()=>toast('ID copiat'))}else if(action==='copyTicket'){copyModal(t)}else if(action==='exportJson')exportJson();else if(action==='importJson')importJson();else if(action==='linkFile')linkFile();else if(action==='forceSave')saveFile(true);else if(action==='csv')exportCSV()}
function copyModal(t){modal('Copiar informació del tiquet','<p>Selecciona què vols compartir. Les notes internes queden excloses per defecte.</p>'+[['main','Capçalera i descripció',true],['details','Estat, dates i sol·licitant',true],['tasks','Subtasques',true],['devices','Dispositius',true],['links','Enllaços',true],['events','Actuacions i comentaris públics',true],['internal','Notes internes (revisar abans de compartir)',false]].map(([v,l,checked])=>'<label class="checkrow"><input type="checkbox" name="'+v+'" '+(checked?'checked':'')+'>'+l+'</label>').join('')+'<div class="field"><label>Introducció</label><textarea name="intro">Bon dia,\n\nUs facilito una actualització del tiquet:</textarea></div>','Copiar','copySubmit')}
async function copySelected(form){const t=getTicket(),v=n=>form.elements[n].checked;const chunks=[],lines=[];const add=(html,text)=>{chunks.push(html);lines.push(text)};const e=esc;if(v('main'))add('<h2 style="margin:8px 0;color:#ae1026">'+e(t.code)+' · '+e(t.title)+'</h2><p>'+e(t.description).replace(/\n/g,'<br>')+'</p>',t.code+' · '+t.title+'\n'+t.description);
if(v('details'))add('<p><b>Estat:</b> '+e(t.status)+' · <b>Prioritat:</b> '+e(t.priority)+'<br><b>Sol·licitant:</b> '+e(t.requester||'—')+'<br><b>Data límit:</b> '+e(t.dueDate||'—')+'</p>','Estat: '+t.status+' · Prioritat: '+t.priority+'\nSol·licitant: '+(t.requester||'—')+'\nData límit: '+(t.dueDate||'—'));
if(v('tasks')&&t.tasks.length)add('<h3>Subtasques</h3><ul>'+t.tasks.map(x=>'<li>'+(x.done?'☑':'☐')+' '+e(x.title)+'</li>').join('')+'</ul>','Subtasques:\n'+t.tasks.map(x=>(x.done?'[x] ':'[ ] ')+x.title).join('\n'));
if(v('devices')&&t.devices.length)add('<h3>Dispositius</h3><ul>'+t.devices.map(d=>'<li>'+e(d.role==='loan'?'Equip cedit: ':'Amb problema: ')+e(d.model)+' · '+e(d.inventory)+'</li>').join('')+'</ul>','Dispositius:\n'+t.devices.map(d=>(d.role==='loan'?'Cedit: ':'Afectat: ')+d.model+' '+d.inventory).join('\n'));
if(v('links')&&t.links.length)add('<h3>Referències</h3><ul>'+t.links.map(x=>'<li><a href="'+e(x.url)+'">'+e(x.title)+'</a></li>').join('')+'</ul>','Enllaços:\n'+t.links.map(x=>x.title+': '+x.url).join('\n'));
const events=t.events.filter(x=>x.kind==='Comentari'&&(v('internal')||!x.internal));if(v('events')&&events.length)add('<h3>Comentaris</h3><ul>'+events.map(x=>'<li>'+e(x.text)+'</li>').join('')+'</ul>','Comentaris:\n'+events.map(x=>'- '+x.text).join('\n'));
const intro=form.elements.intro.value;const rich='<div style="font-family:Arial,sans-serif;color:#222;max-width:700px"><p>'+e(intro).replace(/\n/g,'<br>')+'</p><div style="border-left:4px solid #ae1026;padding:10px 16px;background:#fafafa">'+chunks.join('')+'</div><p>Servei TAC<br>Institut Mollet del Vallès</p></div>',plain=intro+'\n\n'+lines.join('\n\n')+'\n\nServei TAC · Institut Mollet del Vallès';try{if(typeof ClipboardItem!=='undefined'&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([rich],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);toast('Informe HTML copiat')}else{await navigator.clipboard.writeText(plain);toast('Text copiat (sense format HTML)')}closeModal()}catch{toast('El navegador no ha permès copiar. Comprova els permisos.')}}
async function saveModal(form){if(openModal.saveAction==='copySubmit'){await copySelected(form);return}const data=Object.fromEntries(new FormData(form));const t=getTicket();if(view==='detail'&&openModal.title==='Nova subtasca'){t.tasks.push({uuid:id(),title:data.title,done:false});log(t,'Subtasca','Afegida: '+data.title);t.updatedAt=now()}else if(view==='detail'&&openModal.title==='Nou comentari'){log(t,'Comentari',data.text,!!data.internal);t.updatedAt=now()}else if(view==='detail'&&openModal.title==='Vincular dispositiu'){if(data.role==='loan'&&data.inventory&&db.tickets.some(x=>x.devices?.some(d=>d.role==='loan'&&!d.returnedAt&&d.inventory===data.inventory))){toast('Aquest inventari ja consta com a prestat');return}t.devices.push({uuid:id(),...data,returnedAt:null,createdAt:now()});log(t,'Dispositiu',data.role==='loan'?'Cedit: '+(data.inventory||data.model):'Afectat: '+(data.inventory||data.model));t.updatedAt=now()}else if(view==='detail'&&openModal.title==='Afegir enllaç'){t.links.push({uuid:id(),...data});log(t,'Enllaç','Afegit: '+data.title);t.updatedAt=now()}else if(openModal.title.includes('accés ràpid')){if(!/^https?:\/\//i.test(data.url)){toast('La URL ha de començar per https://');return}const s=db.shortcuts.find(x=>x.uuid===selectedId);if(s)Object.assign(s,data,{favorite:!!data.favorite,wide:!!data.wide});else db.shortcuts.push({uuid:id(),...data,favorite:!!data.favorite,wide:!!data.wide});view='shortcuts'}else if(openModal.title==='Crear tiquet'||openModal.title==='Editar tiquet'){if(!data.title.trim()){toast('Cal indicar un títol');return}if(t){const old=t.status;Object.assign(t,data,{updatedAt:now()});log(t,'Edició','S’han actualitzat les dades del tiquet');if(old!==t.status)log(t,'Estat',old+' → '+t.status);if(CLOSED.includes(t.status)&&!t.resolvedAt)t.resolvedAt=now();if(!CLOSED.includes(t.status))t.resolvedAt=null}else{const year=new Date().getFullYear();const n=(db.nextNumberByYear[year]||0)+1;db.nextNumberByYear[year]=n;const ticket={uuid:id(),code:'TAC-'+year+'-'+String(n).padStart(4,'0'),...data,createdAt:now(),updatedAt:now(),resolvedAt:null,tasks:[],devices:[],links:[],events:[]};log(ticket,'Creació','S’ha creat el tiquet');db.tickets.push(ticket);selectedId=ticket.uuid}view='detail'}closeModal();changed();toast('Canvis desats localment')}
async function hash(text){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,'0')).join('')}
async function linkFile(){if(!window.showOpenFilePicker){toast('Fes servir Edge o Chrome d’escriptori per vincular un fitxer');return}try{const [h]=await showOpenFilePicker({types:[{description:'Base de dades JSON',accept:{'application/json':['.json']}}]});const txt=await (await h.getFile()).text();const obj=JSON.parse(txt);if(!valid(obj))throw Error('JSON incompatible');if(dirty&&!confirm('Hi ha canvis locals no exportats. Vols substituir-los pel fitxer seleccionat?'))return;fileHandle=h;fileSignature=await hash(txt);db=obj;dirty=false;selectedId=null;view='home';await put('database',db);await put('fileHandle',h);render();toast('Fitxer vinculat i carregat')}catch(e){if(e.name!=='AbortError')toast('No es pot vincular: '+e.message)}}
async function saveFile(manual){if(!fileHandle){if(manual)toast('Primer vincula un fitxer JSON a Configuració');return}try{const permission=await fileHandle.queryPermission({mode:'readwrite'});if(permission!=='granted'){if(!manual){toast('Pendent de permís d’escriptura; desa manualment');return}if(await fileHandle.requestPermission({mode:'readwrite'})!=='granted')throw Error('Permís denegat')}const old=await(await fileHandle.getFile()).text();const current=await hash(old);if(fileSignature!==null&&current!==fileSignature){toast('CONFLICTE: fitxer modificat externament. No s’ha sobreescrit; exporta una còpia abans de tornar a vincular.');return}const next=JSON.stringify(db,null,2),w=await fileHandle.createWritable();await w.write(next);await w.close();fileSignature=await hash(next);dirty=false;render();if(manual)toast('Fitxer local actualitzat; OneDrive pot continuar sincronitzant')}catch(e){toast('No s’ha pogut escriure: '+e.message)}}
function download(content,name,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJson(){download(JSON.stringify(db,null,2),'e-tiquet-tac-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Còpia JSON descarregada')}
function importJson(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const obj=JSON.parse(await i.files[0].text());if(!valid(obj))throw Error('Format incorrecte');if(!confirm('Substituir la base de dades local? Descarrega primer una còpia si tens dades importants.'))return;db=obj;fileHandle=null;fileSignature=null;dirty=true;await put('fileHandle',null);changed();view='home';render();toast('JSON importat. Vincula un fitxer per desar-lo externament.')}catch(e){toast('Error: '+e.message)}};i.click()}
function exportCSV(){const rows=[['ID','Títol','Estat','Prioritat','Categoria','Sol·licitant','Responsable','Creat','Actualitzat'],...db.tickets.map(t=>[t.code,t.title,t.status,t.priority,t.category,t.requester,t.assignee,t.createdAt,t.updatedAt])];download('\ufeff'+rows.map(r=>r.map(s=>'"'+String(s??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'tiquets-tac.csv','text/csv;charset=utf-8')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();eventAction(b.dataset.act,b)}const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;selectedId=null;render()}const row=e.target.closest('[data-ticket]');if(row&&!b){selectedId=row.dataset.ticket;view='detail';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();saveModal(e.target).catch(err=>toast(err.message))}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){statusFilter=e.target.value;render()}else if(e.target.id==='detailStatus'||e.target.id==='detailPriority'){const t=getTicket();if(!t)return;const key=e.target.id==='detailStatus'?'status':'priority';const old=t[key];t[key]=e.target.value;if(old!==t[key]){log(t,key==='status'?'Estat':'Prioritat',old+' → '+t[key]);if(key==='status'){t.resolvedAt=CLOSED.includes(t.status)?now():null}t.updatedAt=now();changed()}}else if(e.target.matches('[data-task]')){const t=getTicket(),task=t.tasks.find(x=>x.uuid===e.target.dataset.task);if(task){task.done=e.target.checked;log(t,'Subtasca',(task.done?'Completada: ':'Reoberta: ')+task.title);t.updatedAt=now();changed()}}});
window.addEventListener('beforeunload',e=>{if(dirty&&fileHandle){e.preventDefault();e.returnValue=''}});
(async()=>{try{const stored=await get('database');if(valid(stored))db=stored;const handle=await get('fileHandle');if(handle){fileHandle=handle;try{const txt=await(await handle.getFile()).text(),external=JSON.parse(txt);fileSignature=await hash(txt);if(valid(external)){if(external.revision>db.revision){if(confirm('El fitxer vinculat té una revisió més nova. Vols carregar-la?')){db=external;await put('database',db)}else dirty=true}else if(external.revision<db.revision)dirty=true}else dirty=true}catch{fileHandle=null;dirty=true}}render()}catch(e){render();toast('No s’ha pogut carregar l’emmagatzematge local: '+e.message)}})();
</script></body></html>
